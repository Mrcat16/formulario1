<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geralt De Rivia</title>

    <!-- Librería SheetJS para generar archivos Excel sin servidor -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        body {
            background-color: rgb(35, 30, 30);
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #titulo { 
            color: rgb(255, 0, 0); 
            text-align: center; 
            animation: girar 2s linear infinite; 
        }

        @keyframes girar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(25deg); }
        }

        #sustitulo {
            color: blue;
        }

        #sustitulos2 {
            color: rgb(0, 255, 221);
        }

        #imagen {
            display: block; 
            margin-left: auto; 
            margin-right: auto;
        }

        label {
            display: block;
        }

        #juego {
            color: rgb(0, 47, 255);
        }

        #juegosustitulos {
            color: rgb(0, 34, 255);
        }

        .titulo-label {
            color: #ff0000;
            font-weight: bold;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="login"> 
        <h2>Iniciar Sesión</h2>
        <input type="password" id="usuario" placeholder="Usuario"> <br><br>
        <input type="password" id="clave" placeholder="Contraseña"> <br><br>
        <button onclick="validarAcceso()">Ingresar</button>
        <p id="mensaje-error" style="color: red;"></p>
    </div>
    
    <!-- CONTENIDO PRINCIPAL -->
    <div id="contenido_de_la_pagina" style="display: none;">
        <h1 id="titulo"></h1>
        <h2 id="sustitulo"></h2>
        <img id="imagen" alt="Descripcion de la imagen" width="300">
        <h2 id="sustitulos2"></h2>
        
        <label class="titulo-label" for="juego">Juego:</label>
        <input type="text" id="juego" value="The wicher 3" readonly>
        
        <label class="titulo-label" for="juegosustitulos">Año de salida:</label>
        <input type="text" id="juegosustitulos" value="2015" readonly>
        <br><br>
        
        <iframe id="mi-frame" width="100%" height="500" src="https://www.youtube.com/embed/t1cFsbuSKQ8" frameborder="0" allowfullscreen></iframe>
        <p id="contador-visitas" style="color: yellow; font-weight: bold;"></p>

        <hr>
        <h2>Encuesta Witcher</h2>
        <form id="formulario-witcher">
            <input type="text" id="nombre" placeholder="Nombres" required><br><br>
            <input type="text" id="apellido" placeholder="Apellidos" required><br><br>
            <input type="number" id="edad" placeholder="Edad" required><br><br>
            <label class="titulo-label" for="gusto">¿Qué tanto te gusta la saga The Witcher del 1 al 10?</label>
            <input type="number" id="gusto" min="1" max="10" placeholder="Del 1 al 10" required><br><br>
            <label class="titulo-label" for="opinion">¿Por qué?</label>
            <textarea id="opinion" placeholder="Escribe el porqué de la nota" rows="4" cols="40" required></textarea><br><br>
            
            <!-- Botón para descargar directo en Excel -->
            <button type="button" onclick="descargarExcel()">Guardar y Descargar Excel</button>
        </form>
        <p id="mensaje-envio" style="color: yellow; font-weight: bold;"></p>
    </div>

    <script>
        let intentos = 0;

        function validarAcceso() {
            let usuarioEscrito = document.getElementById("usuario").value;
            let claveEscrita = document.getElementById("clave").value;

            if (usuarioEscrito === "Geralt" && claveEscrita === "De Rivia") {
                document.getElementById("login").style.display = "none";
                document.getElementById("contenido_de_la_pagina").style.display = "block";
                document.getElementById("titulo").textContent = "Geralt De Rivia";
                document.getElementById("sustitulo").textContent = "Geralt de Rivia es un personaje de la saga de videojuegos The Witcher";
                document.getElementById("imagen").src = "Geralt.jpg";
                document.getElementById("sustitulos2").textContent = "Es famoso en su mundo por ser un gran cazador de monstruos y es conocido por 'Supuestamente matar al rey Foltest'";

                let visitas = Number(localStorage.getItem("visitasContador")) || 0;
                visitas++;
                localStorage.setItem("visitasContador", visitas);
                document.getElementById("contador-visitas").textContent = "Has entrado a esta página " + visitas + " vez/veces.";
            } else {
                intentos++;
                if (intentos >= 3) {
                    document.getElementById("mensaje-error").textContent = "Acceso bloqueado. Por favor reinicia la página para volver a intentarlo.";
                    document.getElementById("usuario").disabled = true;
                    document.getElementById("clave").disabled = true;
                } else {
                    let restantes = 3 - intentos;
                    document.getElementById("mensaje-error").textContent = "Te quedan " + restantes + " intento(s)";
                }
            }
        }

        function descargarExcel() {
            let nombre = document.getElementById("nombre").value;
            let apellido = document.getElementById("apellido").value;
            let edad = document.getElementById("edad").value;
            let gusto = document.getElementById("gusto").value;
            let opinion = document.getElementById("opinion").value;

            if (!nombre || !apellido || !edad || !gusto || !opinion) {
                alert("Por favor completa todos los campos antes de descargar.");
                return;
            }

            // Construcción del objeto de datos
            let datos = [{
                Nombre: nombre,
                Apellido: apellido,
                Edad: Number(edad),
                "Puntuación (1-10)": Number(gusto),
                Opinión: opinion,
                Fecha: new Date().toLocaleString()
            }];

            // Generación y descarga del archivo Excel en el cliente
            let hoja = XLSX.utils.json_to_sheet(datos);
            let libro = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(libro, hoja, "Respuestas");
            XLSX.writeFile(libro, "encuesta_witcher.xlsx");

            document.getElementById("mensaje-envio").textContent = "¡Archivo Excel generado y descargado con éxito!";
            document.getElementById("formulario-witcher").reset();
        }
    </script>
</body>
</html>
