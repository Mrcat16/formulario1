<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geralt De Rivia</title>
    <!-- Librería SheetJS para generar el Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            background-color: rgb(35, 30, 30);
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #titulo { 
            color: rgb(255, 0, 0); 
            text-align: center; 
            animation: girar 2s linear infinite; 
        }
        @keyframes girar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(25deg); }
        }
        #sustitulo { color: blue; }
        #sustitulos2 { color: rgb(0, 255, 221); }
        #imagen {
            display: block; 
            margin-left: auto; 
            margin-right: auto;
        }
        label { display: block; margin-top: 10px; }
        #juego { color: rgb(0, 47, 255); }
        #juegosustitulos { color: rgb(0, 34, 255); }
        .titulo-label {
            color: #ff0000;
            font-weight: bold;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 15px;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div id="login"> 
        <h2>Iniciar Sesión</h2>
        <input type="password" id="usuario" placeholder="Usuario"> <br><br>
        <input type="password" id="clave" placeholder="Contraseña"> <br><br>
        <button onclick="validarAcceso()">Ingresar</button>
        <p id="mensaje-error" style="color: red;"></p>
    </div>
    
    <div id="contenido_de_la_pagina" style="display: none;">
        <h1 id="titulo"></h1>
        <h2 id="sustitulo"></h2>
        <img id="imagen" alt="Geralt de Rivia" width="300">
        <h2 id="sustitulos2"></h2>
        
        <label class="titulo-label" for="juego">Juego:</label>
        <input type="text" id="juego" value="The Witcher 3" readonly>
        
        <label class="titulo-label" for="juegosustitulos">Año de salida:</label>
        <input type="text" id="juegosustitulos" value="2015" readonly>
        <br><br>
        
        <iframe id="mi-frame" width="100%" height="500" src="https://www.youtube.com/embed/t1cFsbuSKQ8" frameborder="0" allowfullscreen></iframe>
        <p id="contador-visitas" style="color: yellow; font-weight: bold;"></p>
        <hr>
        
        <h2>Encuesta Witcher</h2>
        <form id="formulario-witcher">
            <input type="text" id="nombre" placeholder="Nombres" required><br>
            <input type="text" id="apellido" placeholder="Apellidos" required><br>
            
            <label class="titulo-label" for="edad">Edad (mínimo 12, máximo 100):</label>
            <!-- onkeydown bloquea signos negativos y la letra 'e'. oninput no deja que pase de 100 -->
            <input type="number" id="edad" placeholder="Edad" required
                   onkeydown="if(event.key === '-' || event.key === 'e') return false;"
                   oninput="if(this.value > 100) this.value = 100;"><br>
            
            <label class="titulo-label" for="gusto">¿Qué tanto te gusta la saga The Witcher del 1 al 10?</label>
            <!-- Igual aquí, bloquea negativos y no deja que pase de 10 -->
            <input type="number" id="gusto" placeholder="Del 1 al 10" required
                   onkeydown="if(event.key === '-' || event.key === 'e') return false;"
                   oninput="if(this.value > 10) this.value = 10;"><br>
            
            <label class="titulo-label" for="opinion">¿Por qué?</label><br>
            <textarea id="opinion" placeholder="Escribe el porqué de la nota" rows="4" cols="40" required></textarea><br>
            
            <!-- Este botón hace TODO: Guarda, acumula la lista y descarga el Excel protegido -->
            <button type="button" onclick="guardarYActualizarExcel()">Guardar Encuesta y Actualizar Excel</button>
        </form>
        <p id="mensaje-envio" style="color: yellow; font-weight: bold;"></p>
    </div>

    <script>
        let intentos = 0;

        function validarAcceso() {
            let usuarioEscrito = document.getElementById("usuario").value;
            let claveEscrita = document.getElementById("clave").value;

            if (usuarioEscrito === "Geralt" && claveEscrita === "De Rivia") {
                document.getElementById("login").style.display = "none";
                document.getElementById("contenido_de_la_pagina").style.display = "block";
                document.getElementById("titulo").textContent = "Geralt De Rivia";
                document.getElementById("sustitulo").textContent = "Geralt de Rivia es un personaje de la saga de videojuegos The Witcher";
                document.getElementById("imagen").src = "Geralt.jpg";
                document.getElementById("sustitulos2").textContent = "Es famoso en su mundo por ser un gran cazador de monstruos y es conocido por 'Supuestamente matar al rey Foltest'";
                
                let visitas = Number(localStorage.getItem("visitasContador")) || 0;
                visitas++;
                localStorage.setItem("visitasContador", visitas);
                document.getElementById("contador-visitas").textContent = "Has entrado a esta página " + visitas + " vez/veces.";
            } else {
                intentos++;
                if (intentos >= 3) {
                    document.getElementById("mensaje-error").textContent = "Acceso bloqueado. Por favor reinicia la página para volver a intentarlo.";
                    document.getElementById("usuario").disabled = true;
                    document.getElementById("clave").disabled = true;
                } else {
                    let restantes = 3 - intentos;
                    document.getElementById("mensaje-error").textContent = "Te quedan " + restantes + " intento(s)";
                }
            }
        }

        function guardarYActualizarExcel() {
            let nombre = document.getElementById("nombre").value.trim();
            let apellido = document.getElementById("apellido").value.trim();
            let edadInput = document.getElementById("edad").value;
            let gustoInput = document.getElementById("gusto").value;
            let opinion = document.getElementById("opinion").value.trim();

            // 1. Validar que nada esté vacío
            if (!nombre || !apellido || !edadInput || !gustoInput || !opinion) {
                alert("Por favor, completa todos los campos.");
                return;
            }

            let edad = Number(edadInput);
            let gusto = Number(gustoInput);

            // 2. Validación de edad mínima estricta (12 años)
            if (edad < 12) {
                alert("Lo sentimos, el mínimo de años necesarios para realizar la encuesta es de 12 años.");
                return;
            }

            // 3. Traer encuestas anteriores (si existen)
            let historialEncuestas = JSON.parse(localStorage.getItem("encuestas_witcher")) || [];

            // 4. Crear los datos del nuevo registro
            let nuevaRespuesta = {
                "Nº": historialEncuestas.length + 1,
                "Nombre": nombre,
                "Apellido": apellido,
                "Edad": edad,
                "Puntuación (1-10)": gusto,
                "Opinión": opinion,
                "Fecha de Registro": new Date().toLocaleString()
            };

            // 5. Acumular el registro con los anteriores
            historialEncuestas.push(nuevaRespuesta);
            localStorage.setItem("encuestas_witcher", JSON.stringify(historialEncuestas));

            // 6. Crear la hoja de Excel con TODOS los datos acumulados
            let hoja = XLSX.utils.json_to_sheet(historialEncuestas);

            // 7. Bloquear el Excel para que sea de SÓLO LECTURA y no se pueda modificar
            hoja['!protect'] = {
                password: "123", // Contraseña para proteger la hoja en Excel
                selectLockedCells: true,
                selectUnlockedCells: false
            };

            let libro = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(libro, hoja, "Resultados");

            // 8. Generar y descargar el Excel "Actualizado"
            XLSX.writeFile(libro, "Encuestas_Acumuladas_Witcher.xlsx");

            // 9. Mostrar mensaje de éxito y vaciar el formulario
            document.getElementById("mensaje-envio").textContent = "¡Encuesta guardada con éxito! Excel actualizado descargado.";
            document.getElementById("formulario-witcher").reset();
        }
    </script>
</body>
</html>
