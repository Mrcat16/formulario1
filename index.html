<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geralt De Rivia</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            background-color: rgb(35, 30, 30);
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #titulo { 
            color: rgb(255, 0, 0); 
            text-align: center; 
            animation: girar 2s linear infinite; 
        }
        @keyframes girar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(25deg); }
        }
        #sustitulo {
            color: blue;
        }
        #sustitulos2 {
            color: rgb(0, 255, 221);
        }
        #imagen {
            display: block; 
            margin-left: auto; 
            margin-right: auto;
        }
        label {
            display: block;
        }
        #juego {
            color: rgb(0, 47, 255);
        }
        #juegosustitulos {
            color: rgb(0, 34, 255);
        }
        .titulo-label {
            color: #ff0000;
            font-weight: bold;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 10px;
        }
        .btn-descargar {
            background-color: #28a745;
            color: white;
            border: none;
        }
    </style>
</head>
<body>
    <div id="login"> 
        <h2>Iniciar Sesión</h2>
        <input type="password" id="usuario" placeholder="Usuario"> <br><br>
        <input type="password" id="clave" placeholder="Contraseña"> <br><br>
        <button onclick="validarAcceso()">Ingresar</button>
        <p id="mensaje-error" style="color: red;"></p>
    </div>
    
    <div id="contenido_de_la_pagina" style="display: none;">
        <h1 id="titulo"></h1>
        <h2 id="sustitulo"></h2>
        <img id="imagen" alt="Descripcion de la imagen" width="300">
        <h2 id="sustitulos2"></h2>
        <label class="titulo-label" for="juego">Juego:</label>
        <input type="text" id="juego" value="The wicher 3" readonly>
        <label class="titulo-label" for="juegosustitulos">Año de salida:</label>
        <input type="text" id="juegosustitulos" value="2015" readonly>
        <br><br>
        <iframe id="mi-frame" width="100%" height="500" src="https://www.youtube.com/embed/t1cFsbuSKQ8" frameborder="0" allowfullscreen></iframe>
        <p id="contador-visitas" style="color: yellow; font-weight: bold;"></p>
        <hr>
        <h2>Encuesta Witcher</h2>
        <form id="formulario-witcher">
            <input type="text" id="nombre" placeholder="Nombres" required><br><br>
            <input type="text" id="apellido" placeholder="Apellidos" required><br><br>
            
            <label class="titulo-label" for="edad">Edad (mínimo 12, máximo 100):</label>
            <input type="number" id="edad" min="12" max="100" placeholder="Edad (12 a 100)" required><br><br>
            
            <label class="titulo-label" for="gusto">¿Qué tanto te gusta la saga The Witcher del 1 al 10?</label>
            <input type="number" id="gusto" min="1" max="10" placeholder="Del 1 al 10" required><br><br>
            
            <label class="titulo-label" for="opinion">¿Por qué?</label>
            <textarea id="opinion" placeholder="Escribe el porqué de la nota" rows="4" cols="40" required></textarea><br><br>
            
            <button type="button" id="btn-guardar" onclick="guardarRegistro()">Guardar datos</button>
            <button type="button" class="btn-descargar" onclick="descargarExcel()">Descargar Excel Acumulado</button>
        </form>
        <p id="mensaje-envio" style="color: yellow; font-weight: bold;"></p>
    </div>

    <script>
        let intentos = 0;

        function validarAcceso() {
            let usuarioEscrito = document.getElementById("usuario").value;
            let claveEscrita = document.getElementById("clave").value;

            if (usuarioEscrito === "Geralt" && claveEscrita === "De Rivia") {
                document.getElementById("login").style.display = "none";
                document.getElementById("contenido_de_la_pagina").style.display = "block";
                document.getElementById("titulo").textContent = "Geralt De Rivia";
                document.getElementById("sustitulo").textContent = "Geralt de Rivia es un personaje de la saga de videojuegos The Witcher";
                document.getElementById("imagen").src = "Geralt.jpg";
                document.getElementById("sustitulos2").textContent = "Es famoso en su mundo por ser un gran cazador de monstruos y es conocido por 'Supuestamente matar al rey Foltest'";
                
                let visitas = Number(localStorage.getItem("visitasContador")) || 0;
                visitas++;
                localStorage.setItem("visitasContador", visitas);
                document.getElementById("contador-visitas").textContent = "Has entrado a esta página " + visitas + " vez/veces.";
            } else {
                intentos++;
                if (intentos >= 3) {
                    document.getElementById("mensaje-error").textContent = "Acceso bloqueado. Por favor reinicia la página para volver a intentarlo.";
                    document.getElementById("usuario").disabled = true;
                    document.getElementById("clave").disabled = true;
                } else {
                    let restantes = 3 - intentos;
                    document.getElementById("mensaje-error").textContent = "Te quedan " + restantes + " intento(s)";
                }
            }
        }

        function guardarRegistro() {
            let nombre = document.getElementById("nombre").value.trim();
            let apellido = document.getElementById("apellido").value.trim();
            let edadInput = document.getElementById("edad").value;
            let gustoInput = document.getElementById("gusto").value;
            let opinion = document.getElementById("opinion").value.trim();

            // 1. Validar campos vacíos
            if (!nombre || !apellido || !edadInput || !gustoInput || !opinion) {
                alert("Por favor completa todos los campos antes de guardar.");
                return;
            }

            let edad = Number(edadInput);
            let gusto = Number(gustoInput);

            // 2. Validaciones de Edad (mínimo 12, máximo 100)
            if (isNaN(edad) || edad < 12 || edad > 100) {
                alert("Error: La edad debe estar entre 12 y 100 años.");
                return;
            }

            // 3. Validaciones de Puntaje (mínimo 1, máximo 10)
            if (isNaN(gusto) || gusto < 1 || gusto > 10) {
                alert("Error: El puntaje debe estar entre 1 y 10.");
                return;
            }

            // 4. Obtener el historial previo acumulado
            let historialEncuestas = JSON.parse(localStorage.getItem("encuestas_witcher")) || [];

            // 5. Crear la nueva respuesta
            let nuevaRespuesta = {
                "Nº": historialEncuestas.length + 1,
                Nombre: nombre,
                Apellido: apellido,
                Edad: edad,
                "Puntuación (1-10)": gusto,
                Opinión: opinion,
                Fecha: new Date().toLocaleString()
            };

            // 6. Agregar al historial y guardar en localStorage
            historialEncuestas.push(nuevaRespuesta);
            localStorage.setItem("encuestas_witcher", JSON.stringify(historialEncuestas));

            document.getElementById("mensaje-envio").textContent = "¡Datos guardados correctamente! Registro Nº " + historialEncuestas.length + " acumulado.";
            document.getElementById("formulario-witcher").reset();
        }

        function descargarExcel() {
            let historialEncuestas = JSON.parse(localStorage.getItem("encuestas_witcher")) || [];

            if (historialEncuestas.length === 0) {
                alert("No hay registros guardados para exportar. Ingresa una respuesta y presiona 'Guardar datos'.");
                return;
            }

            // Crear la hoja de trabajo a partir de las encuestas guardadas
            let hoja = XLSX.utils.json_to_sheet(historialEncuestas);

            // Proteger la hoja para sugerir modo de solo lectura
            hoja['!protect'] = {
                selectLockedCells: true,
                selectUnlockedCells: true,
                formatCells: false,
                formatColumns: false,
                formatRows: false,
                insertColumns: false,
                insertRows: false,
                insertHyperlinks: false,
                deleteColumns: false,
                deleteRows: false,
                sort: false,
                autoFilter: false,
                pivotTables: false
            };

            let libro = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(libro, hoja, "Respuestas");

            // Configurar propiedades de protección en la estructura del libro
            if (!libro.Workbook) libro.Workbook = {};
            if (!libro.Workbook.Protect) libro.Workbook.Protect = {};
            libro.Workbook.Protect.LockStructure = true;

            XLSX.writeFile(libro, "encuesta_witcher.xlsx");
            document.getElementById("mensaje-envio").textContent = "¡Excel generado en modo lectura con " + historialEncuestas.length + " registro(s)!";
        }
    </script>
</body>
</html>
